<svg width="860" height="280" viewBox="0 0 860 280" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Mesud Hassen — MHM Software and IT Solutions">
  <title>Mesud Hassen — MHM Software &amp; IT Solutions</title>
  <defs>
    <!-- Dark tech background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="60%" r="65%">
      <stop offset="0%"  stop-color="#0d2144"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>

    <!-- Name gradient: silver → white → silver -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="35%"  stop-color="#e8f4ff"/>
      <stop offset="65%"  stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1a6bc4"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#58a6ff"/>
      <stop offset="70%"  stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- MHM letter glow filter -->
    <filter id="nameGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow for name -->
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#58a6ff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" fill="url(#bgGlow)"/>

  <!-- Circuit grid lines - horizontal -->
  <g stroke="#1a3a6e" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="40"  x2="860" y2="40"/>
    <line x1="0" y1="80"  x2="860" y2="80"/>
    <line x1="0" y1="120" x2="860" y2="120"/>
    <line x1="0" y1="160" x2="860" y2="160"/>
    <line x1="0" y1="200" x2="860" y2="200"/>
    <line x1="0" y1="240" x2="860" y2="240"/>
  </g>
  <!-- Circuit grid lines - vertical -->
  <g stroke="#1a3a6e" stroke-width="0.5" opacity="0.4">
    <line x1="80"  y1="0" x2="80"  y2="280"/>
    <line x1="160" y1="0" x2="160" y2="280"/>
    <line x1="240" y1="0" x2="240" y2="280"/>
    <line x1="320" y1="0" x2="320" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="560" y1="0" x2="560" y2="280"/>
    <line x1="640" y1="0" x2="640" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
  </g>

  <!-- Glowing circuit nodes -->
  <g fill="#58a6ff" opacity="0.35">
    <circle cx="80"  cy="80"  r="2.5"/>
    <circle cx="160" cy="160" r="2.5"/>
    <circle cx="240" cy="40"  r="2"/>
    <circle cx="320" cy="200" r="2"/>
    <circle cx="480" cy="120" r="2.5"/>
    <circle cx="560" cy="240" r="2"/>
    <circle cx="640" cy="80"  r="2.5"/>
    <circle cx="720" cy="160" r="2"/>
    <circle cx="800" cy="40"  r="2.5"/>
  </g>

  <!-- Floating particles (stars) -->
  <g fill="#58a6ff">
    <circle cx="30"  cy="25"  r="1.2" opacity="0.6"/>
    <circle cx="120" cy="18"  r="0.8" opacity="0.5"/>
    <circle cx="200" cy="55"  r="1"   opacity="0.4"/>
    <circle cx="380" cy="22"  r="1.5" opacity="0.7"/>
    <circle cx="500" cy="35"  r="0.8" opacity="0.5"/>
    <circle cx="620" cy="15"  r="1.2" opacity="0.6"/>
    <circle cx="750" cy="30"  r="1"   opacity="0.4"/>
    <circle cx="840" cy="55"  r="1.5" opacity="0.7"/>
    <circle cx="50"  cy="250" r="1"   opacity="0.4"/>
    <circle cx="180" cy="265" r="1.2" opacity="0.5"/>
    <circle cx="700" cy="255" r="1"   opacity="0.4"/>
    <circle cx="820" cy="260" r="1.5" opacity="0.6"/>
  </g>
  <g fill="#3fb950">
    <circle cx="70"  cy="180" r="0.8" opacity="0.5"/>
    <circle cx="290" cy="265" r="1"   opacity="0.4"/>
    <circle cx="450" cy="18"  r="1.2" opacity="0.6"/>
    <circle cx="680" cy="248" r="0.8" opacity="0.5"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="860" height="2" fill="url(#lineGrad)"/>

  <!-- MHM large background letters (watermark) -->
  <text x="430" y="175" text-anchor="middle"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-size="200" font-weight="900" letter-spacing="20"
        fill="#0d2a4a" opacity="0.5">MHM</text>

  <!-- Main name: MESUD HASSEN -->
  <text x="430" y="155" text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="900" letter-spacing="8"
        fill="url(#nameGrad)" filter="url(#shadow)">MESUD HASSEN</text>

  <!-- Accent lines flanking subtitle -->
  <line x1="180" y1="180" x2="320" y2="180" stroke="url(#lineGrad)" stroke-width="1" opacity="0.7"/>
  <line x1="540" y1="180" x2="680" y2="180" stroke="url(#lineGrad)" stroke-width="1" opacity="0.7"/>

  <!-- Subtitle -->
  <text x="430" y="177" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="4"
        fill="url(#subGrad)">SOFTWARE  &amp;  IT  SOLUTIONS</text>

  <!-- Bottom accent line -->
  <rect x="0" y="278" width="860" height="2" fill="url(#lineGrad)"/>
</svg>
