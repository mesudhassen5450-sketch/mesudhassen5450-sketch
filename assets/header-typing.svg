<svg width="860" height="160" viewBox="0 0 860 160" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Mesud Hassen — Full-Stack Web Developer, Software Developer, Networking Enthusiast, Continuous Learner">
  <title>Mesud Hassen — animated header</title>

  <!-- Background -->
  <rect width="860" height="160" rx="12" fill="#0d1117"/>

  <!-- Subtle top accent line -->
  <rect width="860" height="2" rx="1" fill="url(#accentGrad)"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#58a6ff"/>
      <stop offset="70%"  stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>

    <!-- Clip for the typing text so it reveals left-to-right -->
    <clipPath id="clip1"><rect x="0" y="0" width="0" height="40">
      <animate attributeName="width" values="0;420;420;420;0;0" dur="20s" repeatCount="indefinite"
               keyTimes="0;0.12;0.22;0.24;0.27;1" calcMode="spline"
               keySplines="0.4 0 0.2 1; 1 0 1 0; 0.4 0 0.2 1; 0.4 0 0.2 1; 1 0 1 0"/>
    </rect></clipPath>
    <clipPath id="clip2"><rect x="0" y="0" width="0" height="40">
      <animate attributeName="width" values="0;0;0;350;350;350;0;0" dur="20s" repeatCount="indefinite"
               keyTimes="0;0.27;0.30;0.42;0.48;0.50;0.53;1" calcMode="spline"
               keySplines="1 0 1 0; 1 0 1 0; 0.4 0 0.2 1; 1 0 1 0; 0.4 0 0.2 1; 0.4 0 0.2 1; 1 0 1 0"/>
    </rect></clipPath>
    <clipPath id="clip3"><rect x="0" y="0" width="0" height="40">
      <animate attributeName="width" values="0;0;0;380;380;380;0;0" dur="20s" repeatCount="indefinite"
               keyTimes="0;0.53;0.56;0.68;0.74;0.76;0.79;1" calcMode="spline"
               keySplines="1 0 1 0; 1 0 1 0; 0.4 0 0.2 1; 1 0 1 0; 0.4 0 0.2 1; 0.4 0 0.2 1; 1 0 1 0"/>
    </rect></clipPath>
    <clipPath id="clip4"><rect x="0" y="0" width="0" height="40">
      <animate attributeName="width" values="0;0;0;330;330;330;0" dur="20s" repeatCount="indefinite"
               keyTimes="0;0.79;0.82;0.94;0.97;0.99;1" calcMode="spline"
               keySplines="1 0 1 0; 1 0 1 0; 0.4 0 0.2 1; 1 0 1 0; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </rect></clipPath>
  </defs>

  <!-- Name -->
  <text x="43" y="52" font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif"
        font-size="28" font-weight="700" fill="url(#nameGrad)" letter-spacing="0.5">
    Mesud Hassen
  </text>

  <!-- Bracket decoration -->
  <text x="43" y="92" font-family="'Courier New', Courier, monospace"
        font-size="15" fill="#3fb950" opacity="0.7">~/</text>

  <!-- Typing line 1: Full-Stack Web Developer -->
  <g clip-path="url(#clip1)">
    <text x="65" y="92" font-family="'Courier New', Courier, monospace"
          font-size="20" font-weight="600" fill="#58a6ff">
      Full-Stack Web Developer
    </text>
  </g>

  <!-- Typing line 2: Software Developer -->
  <g clip-path="url(#clip2)">
    <text x="65" y="92" font-family="'Courier New', Courier, monospace"
          font-size="20" font-weight="600" fill="#79c0ff">
      Software Developer
    </text>
  </g>

  <!-- Typing line 3: Networking Enthusiast -->
  <g clip-path="url(#clip3)">
    <text x="65" y="92" font-family="'Courier New', Courier, monospace"
          font-size="20" font-weight="600" fill="#3fb950">
      Networking Enthusiast
    </text>
  </g>

  <!-- Typing line 4: Continuous Learner -->
  <g clip-path="url(#clip4)">
    <text x="65" y="92" font-family="'Courier New', Courier, monospace"
          font-size="20" font-weight="600" fill="#e3b341">
      Continuous Learner
    </text>
  </g>

  <!-- Blinking cursor -->
  <text x="65" y="92" font-family="'Courier New', Courier, monospace"
        font-size="20" font-weight="600" fill="#58a6ff" opacity="1">
    <tspan dx="0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </tspan>|</text>

  <!-- Motto -->
  <text x="43" y="130" font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#8b949e" letter-spacing="0.3">
    &#123; patience, faith, and focus &#125;
  </text>

  <!-- Bottom accent dots -->
  <circle cx="800" cy="130" r="3" fill="#58a6ff" opacity="0.5"/>
  <circle cx="815" cy="130" r="3" fill="#3fb950" opacity="0.5"/>
  <circle cx="830" cy="130" r="3" fill="#e3b341" opacity="0.5"/>
</svg>
